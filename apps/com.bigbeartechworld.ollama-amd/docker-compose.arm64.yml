name: big-bear-ollama-amd
services:
  big-bear-ollama-amd:
    container_name: big-bear-ollama-amd
    image: ollama/ollama:0.32.6-rocm@sha256:be5d5211456243ee5bbf6d35a6df4682b8f5c20e9a2a04632af599fd61f86cbe
    restart: unless-stopped
    environment:
    - PORT=11434
