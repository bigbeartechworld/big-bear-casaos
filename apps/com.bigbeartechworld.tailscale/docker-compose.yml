name: big-bear-tailscale
services:
  big-bear-tailscale:
    container_name: big-bear-tailscale
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    restart: unless-stopped
    environment:
    - TS_SERVE_CONFIG=/config/serve-config.json
    - TS_ACCEPT_DNS=false
    - TS_AUTH_ONCE=false
    - TS_AUTHKEY=""
    - TS_HOSTNAME=""
    - TS_ROUTES=""
    - TS_EXTRA_ARGS=""
    - TS_USERSPACE=true
    - TS_STATE_DIR=/var/lib/tailscale
    volumes:
    - /DATA/AppData/$AppID/state:/var/lib/tailscale
    - /DATA/AppData/$AppID/config:/config
    - /DATA/AppData/$AppID/shared:/shared
    - /dev/net/tun:/dev/net/tun
    cap_add:
    - net_admin
    - sys_module
x-casaos:
  id: com.bigbeartechworld.tailscale
  main: big-bear-tailscale
  icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-casaos@gh-pages/apps/com.bigbeartechworld.tailscale/assets/icon.png
  title:
    en_US: Tailscale
  port_map: ''
