name: big-bear-lancache
services:
  app:
    image: lancachenet/monolithic:latest@sha256:851cfdae998754b6160394d4cfc88d76302199cfc21b2066ef838b66279aea59
    environment:
    - USE_GENERIC_CACHE=true
    - LANCACHE_IP=10.0.39.1
    - DNS_BIND_IP=10.0.39.1
    - UPSTREAM_DNS=8.8.8.8
    - CACHE_ROOT=./lancache
    - CACHE_DISK_SIZE=2000g
    - CACHE_INDEX_SIZE=500m
    - CACHE_MAX_AGE=3650d
    - TZ=UTC
    restart: unless-stopped
    ports:
    - 8080:80
    - 10443:443
    volumes:
    - /DATA/AppData/$AppID/cache:/data/cache
    - /DATA/AppData/$AppID/logs:/data/logs
  dns:
    image: lancachenet/lancache-dns:latest@sha256:36f54a53dceeeb68de2a679f101a02614edb0ac7f649750c46cd3c05be71b7d2
    environment:
    - USE_GENERIC_CACHE=true
    - LANCACHE_IP=10.0.39.1
    - DNS_BIND_IP=10.0.39.1
    - UPSTREAM_DNS=8.8.8.8
    - CACHE_ROOT=./lancache
    - CACHE_DISK_SIZE=2000g
    - CACHE_INDEX_SIZE=500m
    - CACHE_MAX_AGE=3650d
    - TZ=UTC
    restart: unless-stopped
    ports:
    - 53:53/udp
    - 53:53/tcp
x-casaos:
  id: com.bigbeartechworld.lancache
  main: app
  icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-casaos@gh-pages/apps/com.bigbeartechworld.lancache/assets/icon.png
  title:
    en_US: LAN Cache
  port_map: '8080'
