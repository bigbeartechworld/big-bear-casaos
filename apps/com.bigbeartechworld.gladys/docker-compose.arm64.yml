name: big-bear-gladys
services:
  app:
    image: gladysassistant/gladys:v4.85.0@sha256:ef200b1ef265206b31fc1b37777c4176a4298c7d03e5458467e31dd98e3c1fa0
    restart: always
    privileged: true
    network_mode: host
    container_name: gladys
    cgroup: host
    environment:
      NODE_ENV: production
      SQLITE_FILE_PATH: /var/lib/gladysassistant/gladys-production.db
      TZ: Europe/Paris
      SERVER_PORT: '1080'
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /DATA/AppData/$AppID/data:/var/lib/gladysassistant
    - /dev:/dev
    - /run/udev:/run/udev
x-casaos:
  id: com.bigbeartechworld.gladys
  main: app
  icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-casaos@gh-pages/apps/com.bigbeartechworld.gladys/assets/icon.png
  title:
    en_US: Gladys Assistant
  port_map: '1080'
