name: big-bear-affine
services:
  affine:
    image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    container_name: affine
    restart: unless-stopped
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - /DATA/AppData/$AppID/storage:/root/.affine/storage
      - /DATA/AppData/$AppID/config:/root/.affine/config
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: "false"
    x-casaos:
      envs:
        - container: REDIS_SERVER_HOST
          description:
            en_US: 'Container Variable: REDIS_SERVER_HOST'
        - container: DATABASE_URL
          description:
            en_US: 'Container Variable: DATABASE_URL'
        - container: AFFINE_INDEXER_ENABLED
          description:
            en_US: 'Container Variable: AFFINE_INDEXER_ENABLED'
      volumes:
        - container: /root/.affine/storage
          description:
            en_US: 'Container Path: /root/.affine/storage'
        - container: /root/.affine/config
          description:
            en_US: 'Container Path: /root/.affine/config'
      ports:
        - container: "3010"
          description:
            en_US: 'Container Port: 3010'
  affine_migration:
    image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    container_name: affine_migration
    volumes:
      - /DATA/AppData/$AppID/storage:/root/.affine/storage
      - /DATA/AppData/$AppID/config:/root/.affine/config
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine@postgres:5432/affine
      AFFINE_INDEXER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    x-casaos:
      envs:
        - container: REDIS_SERVER_HOST
          description:
            en_US: 'Container Variable: REDIS_SERVER_HOST'
        - container: DATABASE_URL
          description:
            en_US: 'Container Variable: DATABASE_URL'
        - container: AFFINE_INDEXER_ENABLED
          description:
            en_US: 'Container Variable: AFFINE_INDEXER_ENABLED'
      volumes:
        - container: /root/.affine/storage
          description:
            en_US: 'Container Path: /root/.affine/storage'
        - container: /root/.affine/config
          description:
            en_US: 'Container Path: /root/.affine/config'
  redis:
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    container_name: affine-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: affine-postgres
    restart: unless-stopped
    volumes:
      - /DATA/AppData/$AppID/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "affine", "-d", "affine"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-casaos:
      envs:
        - container: POSTGRES_USER
          description:
            en_US: 'Container Variable: POSTGRES_USER'
        - container: POSTGRES_DB
          description:
            en_US: 'Container Variable: POSTGRES_DB'
        - container: POSTGRES_INITDB_ARGS
          description:
            en_US: 'Container Variable: POSTGRES_INITDB_ARGS'
        - container: POSTGRES_HOST_AUTH_METHOD
          description:
            en_US: 'Container Variable: POSTGRES_HOST_AUTH_METHOD'
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_US: 'Container Path: /var/lib/postgresql/data'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.affine
  # Main service for this application
  main: affine
  # Detailed description for the application
  description:
    en_US: AFFiNE 0.27.4 is a self-hosted workspace for docs, whiteboards, and knowledge bases, with Postgres and Redis.
  # Brief tagline for the application
  tagline:
    en_US: ""
  # Developer's information
  developer: toeverything
  # Author of this particular configuration
  author: BigBearTechWorld
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/affine.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: Open http://localhost:3010 after startup. The official Compose file stores server.externalUrl in config.json. Put that file in the config volume at /root/.affine/config/config.json and set externalUrl to the URL users will open. Postgres uses trust authentication on the internal network.
  # Title for the application
  title:
    en_US: AFFiNE
  # Category under which the application falls
  category: Productivity
  # Default port mapping for the application
  port_map: "3010"
