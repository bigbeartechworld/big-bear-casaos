name: big-bear-linuxserver-inkscape
services:
  app:
    image: linuxserver/inkscape:1.4.2@sha256:aa5c7ea9077cded71525ee4db9d5a5c9452600c945e51362151a8e151e19091d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "3000"
          description:
            en_US: 'Container Port: 3000'
        - container: "3001"
          description:
            en_US: 'Container Port: 3001'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.inkscape
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: Inkscape is professional quality vector graphics software which runs on Linux, Mac OS X and Windows desktop computers.
  # Brief tagline for the application
  tagline:
    en_US: Professional quality vector graphics software which runs on Linux, Mac OS X and Windows desktop computers.
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/inkscape-logo.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/inkscape-logo.png
  # Title for the application
  title:
    en_US: Inkscape
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "3000"
