name: big-bear-cantinarr
services:
  app:
    image: ghcr.io/windoze95/cantinarr:0.16.0@sha256:92e0c7099303616a833c1a75fdf4904645be4008e981151e24540553b5c4249c
    container_name: big-bear-cantinarr
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      CANTINARR_PUSH_GATEWAY_URL: https://push.cantinarr.com
      CANTINARR_ARR_CALLBACK_URL: ""
    volumes:
      - /DATA/AppData/$AppID/config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8585/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - big_bear_cantinarr_network
    x-casaos:
      envs:
        - container: CANTINARR_PUSH_GATEWAY_URL
          description:
            en_US: 'Container Variable: CANTINARR_PUSH_GATEWAY_URL'
        - container: CANTINARR_ARR_CALLBACK_URL
          description:
            en_US: 'Container Variable: CANTINARR_ARR_CALLBACK_URL'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "8585"
          description:
            en_US: 'Container Port: 8585'
networks:
  big_bear_cantinarr_network:
    driver: bridge
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.cantinarr
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: 'Cantinarr brings media requests and server management into one app. Household members browse and request movies, shows, books, and music, follow downloads, and get notified when content is ready. Admins manage Radarr, Sonarr, Chaptarr, Lidarr, and download clients, review approvals, and investigate stuck downloads from a phone or browser. Connect the services you use after setup. AI is optional: an assistant can help with library questions and requests, while the repair agent investigates persistent download problems and proposes actions for an administrator to review. Cantinarr also offers MCP tools for authorized clients. Service credentials stay server-side and are encrypted at rest.'
  # Screenshot links for the application
  screenshot_link:
    - https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/01-discover.jpg
    - https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/05-phone-discover.jpg
    - https://raw.githubusercontent.com/windoze95/cantinarr-unraid/main/screenshots/04-request.png
  # Brief tagline for the application
  tagline:
    en_US: Media requests and server management in one app
  # Developer's information
  developer: windoze95
  # Author of this particular configuration
  author: windoze95
  # Icon URL for the application
  icon: https://raw.githubusercontent.com/windoze95/cantinarr/main/app/web/icons/Icon-512.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: Cantinarr runs as a single container and serves its web app and API on port 8585. Keep direct HTTP access on your trusted network and use an HTTPS reverse proxy for remote access. Radarr, Sonarr, Chaptarr, Lidarr, download clients, Tautulli, and Plex are all optional and are added from the admin UI after first run. Push notifications to the companion iPhone and Android apps work out of the box through the preset push gateway; clear CANTINARR_PUSH_GATEWAY_URL to turn them off. If your arr containers cannot reach the address you browse Cantinarr on, set CANTINARR_ARR_CALLBACK_URL to an origin they can dial so instant updates work.
  # Title for the application
  title:
    en_US: Cantinarr
  # Category under which the application falls
  category: Media
  # Default port mapping for the application
  port_map: "8585"
