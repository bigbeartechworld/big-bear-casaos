        - container: SIDEKIQ_QUEUE
          description:
            en_US: 'Container Variable: SIDEKIQ_QUEUE'
        - container: SIDEKIQ_DEFAULT
          description:
            en_US: 'Container Variable: SIDEKIQ_DEFAULT'
        - container: SIDEKIQ_THREADS
          description:
            en_US: 'Container Variable: SIDEKIQ_THREADS'
        - container: DB_POOL
          description:
            en_US: 'Container Variable: DB_POOL'
        - container: NO_CHOWN
          description:
            en_US: 'Container Variable: NO_CHOWN'
        - container: MASTODON_PROMETHEUS_EXPORTER_ENABLED
          description:
            en_US: 'Container Variable: MASTODON_PROMETHEUS_EXPORTER_ENABLED'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "80"
          description:
