        - container: "443"
          description:
            en_US: 'Container Port: 443'
        - container: "9394"
          description:
            en_US: 'Container Port: 9394'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.mastodon
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: Mastodon is a free, open-source social network server based on ActivityPub where users can follow friends and discover new ones..
  # Brief tagline for the application
  tagline:
    en_US: A free, open-source social network server based on ActivityPub where users can follow friends and discover new ones. .
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/mastodon-banner.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/mastodon-banner.png
  # Installation tips
  tips:
    before_install:
      en_US: Configure the required database, Redis, domain, and encryption settings before installing. This app requires external services and will not start with empty defaults.
  # Title for the application
  title:
    en_US: Mastodon
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "80"
