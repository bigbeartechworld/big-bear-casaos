          description:
            en_US: 'Container Variable: SMTP_FROM_ADDRESS'
        - container: S3_ENABLED
          description:
            en_US: 'Container Variable: S3_ENABLED'
        - container: WEB_DOMAIN
          description:
            en_US: 'Container Variable: WEB_DOMAIN'
        - container: ES_HOST
          description:
            en_US: 'Container Variable: ES_HOST'
        - container: ES_PORT
          description:
            en_US: 'Container Variable: ES_PORT'
        - container: ES_USER
          description:
            en_US: 'Container Variable: ES_USER'
        - container: ES_PASS
          description:
            en_US: 'Container Variable: ES_PASS'
        - container: S3_BUCKET
          description:
            en_US: 'Container Variable: S3_BUCKET'
        - container: AWS_ACCESS_KEY_ID
          description:
            en_US: 'Container Variable: AWS_ACCESS_KEY_ID'
        - container: AWS_SECRET_ACCESS_KEY
          description:
            en_US: 'Container Variable: AWS_SECRET_ACCESS_KEY'
        - container: S3_ALIAS_HOST
