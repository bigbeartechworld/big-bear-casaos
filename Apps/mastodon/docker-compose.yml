name: big-bear-linuxserver-mastodon
services:
  app:
    image: linuxserver/mastodon:4.7.2@sha256:1a6db728094ad3940da36690d8f4ee2c41124fae653fdda3758e33776d7af41a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOCAL_DOMAIN: $LOCAL_DOMAIN
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      DB_HOST: $DB_HOST
      DB_USER: $DB_USER
      DB_NAME: $DB_NAME
      DB_PASS: $DB_PASS
      DB_PORT: $DB_PORT
      ES_ENABLED: $ES_ENABLED
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: $ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: $ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: $ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      SECRET_KEY_BASE: $SECRET_KEY_BASE
      OTP_SECRET: $OTP_SECRET
      VAPID_PRIVATE_KEY: $VAPID_PRIVATE_KEY
      VAPID_PUBLIC_KEY: $VAPID_PUBLIC_KEY
      SMTP_SERVER: $SMTP_SERVER
      SMTP_PORT: $SMTP_PORT
      SMTP_LOGIN: $SMTP_LOGIN
      SMTP_PASSWORD: $SMTP_PASSWORD
      SMTP_FROM_ADDRESS: $SMTP_FROM_ADDRESS
      S3_ENABLED: $S3_ENABLED
      WEB_DOMAIN: $WEB_DOMAIN
      ES_HOST: $ES_HOST
      ES_PORT: $ES_PORT
      ES_USER: $ES_USER
      ES_PASS: $ES_PASS
      S3_BUCKET: $S3_BUCKET
      AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
      S3_ALIAS_HOST: $S3_ALIAS_HOST
      SIDEKIQ_ONLY: $SIDEKIQ_ONLY
      SIDEKIQ_QUEUE: $SIDEKIQ_QUEUE
      SIDEKIQ_DEFAULT: $SIDEKIQ_DEFAULT
      SIDEKIQ_THREADS: $SIDEKIQ_THREADS
      DB_POOL: $DB_POOL
      NO_CHOWN: $NO_CHOWN
      MASTODON_PROMETHEUS_EXPORTER_ENABLED: $MASTODON_PROMETHEUS_EXPORTER_ENABLED
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
      - target: 9394
        published: 9394
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mastodon/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
        - container: LOCAL_DOMAIN
          description:
            en_US: 'Container Variable: LOCAL_DOMAIN'
        - container: REDIS_HOST
          description:
            en_US: 'Container Variable: REDIS_HOST'
        - container: REDIS_PORT
          description:
            en_US: 'Container Variable: REDIS_PORT'
        - container: DB_HOST
          description:
            en_US: 'Container Variable: DB_HOST'
        - container: DB_USER
          description:
            en_US: 'Container Variable: DB_USER'
        - container: DB_NAME
          description:
            en_US: 'Container Variable: DB_NAME'
        - container: DB_PASS
          description:
            en_US: 'Container Variable: DB_PASS'
        - container: DB_PORT
          description:
            en_US: 'Container Variable: DB_PORT'
        - container: ES_ENABLED
          description:
            en_US: 'Container Variable: ES_ENABLED'
        - container: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          description:
            en_US: 'Container Variable: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY'
        - container: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          description:
            en_US: 'Container Variable: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY'
        - container: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          description:
            en_US: 'Container Variable: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT'
        - container: SECRET_KEY_BASE
          description:
            en_US: 'Container Variable: SECRET_KEY_BASE'
        - container: OTP_SECRET
          description:
            en_US: 'Container Variable: OTP_SECRET'
        - container: VAPID_PRIVATE_KEY
          description:
            en_US: 'Container Variable: VAPID_PRIVATE_KEY'
        - container: VAPID_PUBLIC_KEY
          description:
            en_US: 'Container Variable: VAPID_PUBLIC_KEY'
        - container: SMTP_SERVER
          description:
            en_US: 'Container Variable: SMTP_SERVER'
        - container: SMTP_PORT
          description:
            en_US: 'Container Variable: SMTP_PORT'
        - container: SMTP_LOGIN
          description:
            en_US: 'Container Variable: SMTP_LOGIN'
        - container: SMTP_PASSWORD
          description:
