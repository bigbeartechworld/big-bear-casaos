name: big-bear-fireshare
services:
  fireshare:
    image: shaneisrael/fireshare:1.8.1
    container_name: fireshare
    ports:
      - "8585:80"
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID/processed:/processed
      - /DATA/AppData/$AppID/videos:/videos
      - /DATA/AppData/$AppID/images:/images
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      # SECRET_KEY intentionally omitted: Fireshare auto-generates a secure
      # random key (Python secrets.token_hex) when unset, so it is unique per
      # deployment. Set it explicitly only to persist sessions across restarts.
      - MINUTES_BETWEEN_VIDEO_SCANS=5
      - THUMBNAIL_VIDEO_LOCATION=10
      - DOMAIN=
      - PUID=1000
      - PGID=1000
      - ENABLE_TRANSCODING=false
      - TRANSCODE_GPU=false
    restart: unless-stopped
    networks:
      - fireshare-network
    x-casaos:
      envs:
        - container: ADMIN_USERNAME
          description:
            en_US: 'Container Variable: ADMIN_USERNAME'
        - container: ADMIN_PASSWORD
          description:
            en_US: 'Container Variable: ADMIN_PASSWORD'
        - container: MINUTES_BETWEEN_VIDEO_SCANS
          description:
            en_US: 'Container Variable: MINUTES_BETWEEN_VIDEO_SCANS'
        - container: THUMBNAIL_VIDEO_LOCATION
          description:
            en_US: 'Container Variable: THUMBNAIL_VIDEO_LOCATION'
        - container: DOMAIN
          description:
            en_US: 'Container Variable: DOMAIN'
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: ENABLE_TRANSCODING
          description:
            en_US: 'Container Variable: ENABLE_TRANSCODING'
        - container: TRANSCODE_GPU
          description:
            en_US: 'Container Variable: TRANSCODE_GPU'
      volumes:
        - container: /data
          description:
            en_US: 'Container Path: /data'
        - container: /processed
          description:
            en_US: 'Container Path: /processed'
        - container: /videos
          description:
            en_US: 'Container Path: /videos'
        - container: /images
          description:
            en_US: 'Container Path: /images'
      ports:
        - container: "80"
          description:
            en_US: 'Container Port: 80'
networks:
  fireshare-network:
    driver: bridge
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.fireshare
  # Main service for this application
  main: fireshare
  # Detailed description for the application
  description:
    en_US: Fireshare lets you host your own video and image content and share it with others via public or private links — no third-party services required. Drop videos into a watched folder and Fireshare automatically scans, generates thumbnails, and organizes them into a clean, searchable library with folder support. Great for game clips, screen recordings, screenshots, and home videos. Features include public/private share links, an admin login, automatic video scanning, OpenGraph link previews, and optional GPU transcoding.
  # Screenshot links for the application
  screenshot_link:
    - https://raw.githubusercontent.com/ShaneIsrael/fireshare/master/.github/images/card-view.png
    - https://raw.githubusercontent.com/ShaneIsrael/fireshare/master/.github/images/folders.png
    - https://raw.githubusercontent.com/ShaneIsrael/fireshare/master/.github/images/folders-game.png
    - https://raw.githubusercontent.com/ShaneIsrael/fireshare/master/.github/images/edit-details.png
    - https://raw.githubusercontent.com/ShaneIsrael/fireshare/master/.github/images/uploading.png
  # Brief tagline for the application
  tagline:
    en_US: Store and share your video game clips and screenshots
  # Developer's information
  developer: Shane Israel
  # Author of this particular configuration
  author: BigBearCommunity
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/fireshare.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: |-
        • Change your login credentials in the container settings using **ADMIN_USERNAME** and **ADMIN_PASSWORD**.

        • Transcoding is disabled by default. To enable it, set **ENABLE_TRANSCODING=true** (and **TRANSCODE_GPU=true** if you have an NVIDIA GPU).
  # Title for the application
  title:
    en_US: Fireshare
  # Category under which the application falls
  category: Media
  # Default port mapping for the application
  port_map: "8585"
