name: big-bear-linuxserver-booksonic-air
services:
  app:
    image: linuxserver/booksonic-air:2201.1.0@sha256:381b4e0026a88832b173b7888cc29320d7979310c742a71e1b40581e25a4358e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONTEXT_PATH: ''
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/booksonic-air/config
        target: /config
      - type: bind
        source: /DATA/AppData/booksonic-air/audiobooks
        target: /audiobooks
      - type: bind
        source: /DATA/AppData/booksonic-air/podcasts
        target: /podcasts
      - type: bind
        source: /DATA/AppData/booksonic-air/othermedia
        target: /othermedia
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
        - container: CONTEXT_PATH
          description:
            en_US: 'Container Variable: CONTEXT_PATH'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
        - container: /audiobooks
          description:
            en_US: 'Container Path: /audiobooks'
        - container: /podcasts
          description:
            en_US: 'Container Path: /podcasts'
        - container: /othermedia
          description:
            en_US: 'Container Path: /othermedia'
      ports:
        - container: "4040"
          description:
            en_US: 'Container Port: 4040'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.booksonic-air
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: 'Visit homepage: https://hub.docker.com/r/linuxserver/booksonic-air/'
  # Brief tagline for the application
  tagline:
    en_US: 'A platform for accessing the audiobooks you own wherever you are. At the moment the platform consists of: * Booksonic Air - A server for streaming your audiobooks, successor to the original Booksonic server and based on Airsonic. * Booksonic App - An DSub based Android app for connection to Booksonic-Air servers.'
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/booksonic-air.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/booksonic-air.png
  # Title for the application
  title:
    en_US: Booksonic-air
  # Category under which the application falls
  category: Others
  # Default port mapping for the application
  port_map: "4040"
