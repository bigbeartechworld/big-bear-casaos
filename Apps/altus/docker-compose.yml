name: big-bear-linuxserver-altus
services:
  app:
    image: linuxserver/altus:5.8.1@sha256:d0da41e0bf3cbd7e2632f01e607942609babe17610d3008132bfce828f337fd9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "3000"
          description:
            en_US: 'Container Port: 3000'
        - container: "3001"
          description:
            en_US: 'Container Port: 3001'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.altus
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: Altus is an Electron-based WhatsApp client with themes and multiple account support.
  # Brief tagline for the application
  tagline:
    en_US: An Electron-based WhatsApp client with themes and multiple account support.
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/altus-logo.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/altus-logo.png
  # Title for the application
  title:
    en_US: Altus
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "3000"
