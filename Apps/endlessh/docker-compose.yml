name: big-bear-linuxserver-endlessh
services:
  app:
    image: linuxserver/endlessh:version-dfe44eb2@sha256:1ba907783c782f2900347a42d730d97ccc88ab50e9c3403657211ca711d02ecc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MSDELAY: ''
      MAXLINES: ''
      MAXCLIENTS: ''
      LOGFILE: ''
      BINDFAMILY: ''
    ports:
      - target: 22
        published: 2222
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/endlessh/config
        target: /config
      - type: bind
        source: /DATA/AppData/endlessh/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
        - container: MSDELAY
          description:
            en_US: 'Container Variable: MSDELAY'
        - container: MAXLINES
          description:
            en_US: 'Container Variable: MAXLINES'
        - container: MAXCLIENTS
          description:
            en_US: 'Container Variable: MAXCLIENTS'
        - container: LOGFILE
          description:
            en_US: 'Container Variable: LOGFILE'
        - container: BINDFAMILY
          description:
            en_US: 'Container Variable: BINDFAMILY'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "22"
          description:
            en_US: 'Container Port: 22'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.endlessh
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: 'Visit homepage: https://github.com/orgs/linuxserver/packages/container/package/endlessh'
  # Brief tagline for the application
  tagline:
    en_US: An SSH tarpit that very slowly sends an endless, random SSH banner. It keeps SSH clients locked up for hours or even days at a time. The purpose is to put your real SSH server on another port and then let the script kiddies get stuck in this tarpit instead of bothering a real server.
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/openssh-server-logo.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/openssh-server-logo.png
  # Title for the application
  title:
    en_US: Endlessh
  # Category under which the application falls
  category: Others
  # Default port mapping for the application
  port_map: "22"
