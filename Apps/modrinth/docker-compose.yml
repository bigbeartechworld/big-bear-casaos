name: big-bear-linuxserver-modrinth
services:
  app:
    image: linuxserver/modrinth:0.21.5@sha256:e58ca416ceae9ac31f2fab100ac3857fe9d2066fc07dcb8dc6af7240890e5ba0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "3000"
          description:
            en_US: 'Container Port: 3000'
        - container: "3001"
          description:
            en_US: 'Container Port: 3001'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.modrinth
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: Modrinth App is a unique, open source launcher that allows you to play your favorite mods, and keep them up to date, all in one neat little package.
  # Brief tagline for the application
  tagline:
    en_US: A unique, open source launcher that allows you to play your favorite mods, and keep them up to date, all in one neat little package.
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/modrinth-logo.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/modrinth-logo.png
  # Title for the application
  title:
    en_US: Modrinth
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "3000"
