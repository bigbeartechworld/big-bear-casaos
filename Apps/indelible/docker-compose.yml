x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.indelible
  # Main service for this application
  main: indelible
  # Detailed description for the application
  description:
    en_US: Indelible is a self-hosted read-it-later and knowledge library. It stores articles, newsletters, PDFs, and EPUBs in PostgreSQL and an S3-compatible object store, and the API serves the web app on the same port.
  # Brief tagline for the application
  tagline:
    en_US: Self-hosted read-it-later library
  # Developer's information
  developer: useindelible
  # Author of this particular configuration
  author: BigBearTechWorld
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/useindelible/indelible@v0.1.1/web/static/favicon.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: 'Open http://localhost:38473 and create the first account. Signups close after that account exists. This is the official localhost trial: plain HTTP, not the production compose. A public hostname needs HTTPS, and production mode refuses to boot without it. Replace JWT_SECRET, CSRF_SECRET, ASSET_COOKIE_SECRET, AUTH_CREDENTIAL_KEY, POSTGRES_PASSWORD, and MINIO_ROOT_PASSWORD before the first start. The catalog values are public. Keep the same Postgres password in DATABASE_URL, and keep S3_SECRET_KEY equal to MINIO_ROOT_PASSWORD on silo and on indelible-silo-init. The initializer reads that environment value when it creates the bucket. CasaOS and ZimaOS edit those literals; they do not substitute Compose variables.'
  # Title for the application
  title:
    en_US: Indelible
  # Category under which the application falls
  category: Productivity
  # Default port mapping for the application
  port_map: "38473"
  scheme: http
  index: /
