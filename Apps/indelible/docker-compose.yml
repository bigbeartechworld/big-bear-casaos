      POSTGRES_PASSWORD: 1c200d72-b081-4f40-a3c3-cb98d604ad76
      POSTGRES_DB: indelible
    volumes:
      - /DATA/AppData/$AppID/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indelible -d indelible"]
      interval: 5s
      timeout: 5s
      retries: 10
    x-casaos:
      envs:
        - container: POSTGRES_USER
          description:
            en_US: 'Container Variable: POSTGRES_USER'
        - container: POSTGRES_PASSWORD
          description:
            en_US: 'Container Variable: POSTGRES_PASSWORD'
        - container: POSTGRES_DB
          description:
            en_US: 'Container Variable: POSTGRES_DB'
      volumes:
        - container: /var/lib/postgresql
          description:
            en_US: 'Container Path: /var/lib/postgresql'
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-08-06T00-00-00Z@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
    container_name: indelible-silo
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: indelible
      MINIO_ROOT_PASSWORD: 2f32d346-ff03-48cb-bfed-2ead51511aa8
    volumes:
      - /DATA/AppData/$AppID/silodata:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    x-casaos:
      envs:
        - container: MINIO_ROOT_USER
          description:
            en_US: 'Container Variable: MINIO_ROOT_USER'
        - container: MINIO_ROOT_PASSWORD
          description:
            en_US: 'Container Variable: MINIO_ROOT_PASSWORD'
      volumes:
