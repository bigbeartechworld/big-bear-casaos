name: big-bear-stoat
services:
  database:
    image: mongo:9.0.2@sha256:bac22ea7710d774103dcad3ec8ac13cba1eb378f488e3ce8a6b3a1adf2ba9dcc
    restart: unless-stopped
    volumes:
      - /DATA/AppData/$AppID/db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    x-casaos:
      volumes:
        - container: /data/db
          description:
            en_US: 'Container Path: /data/db'
  redis:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
  rabbit:
    image: rabbitmq:4.3.6@sha256:3e5cc23235b0eb850f604e8ace10d9a9b6d05be3e36730e53522ee9ead707a9e
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: 3957bd5d-2520-4e23-a28a-e80e2a071d39
    volumes:
      - /DATA/AppData/$AppID/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    x-casaos:
      envs:
        - container: RABBITMQ_DEFAULT_USER
          description:
            en_US: 'Container Variable: RABBITMQ_DEFAULT_USER'
        - container: RABBITMQ_DEFAULT_PASS
          description:
            en_US: 'Container Variable: RABBITMQ_DEFAULT_PASS'
      volumes:
        - container: /var/lib/rabbitmq
          description:
            en_US: 'Container Path: /var/lib/rabbitmq'
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data
    restart: unless-stopped
    volumes:
      - /DATA/AppData/$AppID/minio:/data
    environment:
      MINIO_ROOT_USER: stoatfiles
      MINIO_ROOT_PASSWORD: e347aa2e-1555-4b99-81a3-a09ccb6058ec
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    x-casaos:
      envs:
        - container: MINIO_ROOT_USER
          description:
            en_US: 'Container Variable: MINIO_ROOT_USER'
        - container: MINIO_ROOT_PASSWORD
          description:
            en_US: 'Container Variable: MINIO_ROOT_PASSWORD'
        - container: MINIO_DOMAIN
          description:
            en_US: 'Container Variable: MINIO_DOMAIN'
      volumes:
        - container: /data
          description:
            en_US: 'Container Path: /data'
  caddy:
    image: caddy:2.11.7@sha256:3095ad245c353e3bdb27a38f22a095c1cfa9e295ab21c0214c3e72b0e2960525
    restart: unless-stopped
    environment:
      HOSTNAME: "https://stoat.localhost"
    ports:
      - "20001:80"
      - "20002:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - /DATA/AppData/$AppID/caddy-data:/data
      - /DATA/AppData/$AppID/caddy-config:/config
    networks:
      default:
        aliases:
          - stoat.localhost
          - stoat
    x-casaos:
      envs:
        - container: HOSTNAME
          description:
            en_US: 'Container Variable: HOSTNAME'
      volumes:
        - container: /data
          description:
            en_US: 'Container Path: /data'
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "80"
          description:
            en_US: 'Container Port: 80'
        - container: "443"
          description:
            en_US: 'Container Port: 443'
  web:
    image: ghcr.io/stoatchat/for-web:4017c18@sha256:07d87ec847b11adf39f37352af736b51c0b7ad3e21724f069e341d45d5ae755e
    container_name: stoat-web
    restart: unless-stopped
    environment:
      HOSTNAME: "https://stoat.localhost"
      VITE_HOST: "stoat.localhost"
      VITE_API_URL: "https://stoat.localhost/api"
      VITE_DEV_GIFBOX_URL: "https://stoat.localhost/gifbox"
    x-casaos:
      envs:
        - container: HOSTNAME
          description:
            en_US: 'Container Variable: HOSTNAME'
        - container: VITE_HOST
          description:
            en_US: 'Container Variable: VITE_HOST'
        - container: VITE_API_URL
          description:
            en_US: 'Container Variable: VITE_API_URL'
        - container: VITE_DEV_GIFBOX_URL
          description:
            en_US: 'Container Variable: VITE_DEV_GIFBOX_URL'
  api:
    image: ghcr.io/stoatchat/api:v0.15.5@sha256:35d3c03f0fc4aad4a7b23eb73af88b38fd134a274f991435fb23b32724619b52
    restart: unless-stopped
    environment: &stoat_env
