        - container: REVOLT__RABBIT__HOST
          description:
            en_US: 'Container Variable: REVOLT__RABBIT__HOST'
        - container: REVOLT__RABBIT__PORT
          description:
            en_US: 'Container Variable: REVOLT__RABBIT__PORT'
        - container: REVOLT__RABBIT__USERNAME
          description:
            en_US: 'Container Variable: REVOLT__RABBIT__USERNAME'
        - container: REVOLT__RABBIT__PASSWORD
          description:
            en_US: 'Container Variable: REVOLT__RABBIT__PASSWORD'
        - container: REVOLT__FILES__ENCRYPTION_KEY
          description:
            en_US: 'Container Variable: REVOLT__FILES__ENCRYPTION_KEY'
        - container: REVOLT__FILES__S3__ENDPOINT
          description:
            en_US: 'Container Variable: REVOLT__FILES__S3__ENDPOINT'
        - container: REVOLT__FILES__S3__REGION
          description:
            en_US: 'Container Variable: REVOLT__FILES__S3__REGION'
        - container: REVOLT__FILES__S3__ACCESS_KEY_ID
          description:
            en_US: 'Container Variable: REVOLT__FILES__S3__ACCESS_KEY_ID'
        - container: REVOLT__FILES__S3__SECRET_ACCESS_KEY
          description:
            en_US: 'Container Variable: REVOLT__FILES__S3__SECRET_ACCESS_KEY'
        - container: REVOLT__FILES__S3__DEFAULT_BUCKET
          description:
            en_US: 'Container Variable: REVOLT__FILES__S3__DEFAULT_BUCKET'
        - container: REVOLT__PUSHD__VAPID__PRIVATE_KEY
          description:
            en_US: 'Container Variable: REVOLT__PUSHD__VAPID__PRIVATE_KEY'
        - container: REVOLT__PUSHD__VAPID__PUBLIC_KEY
          description:
            en_US: 'Container Variable: REVOLT__PUSHD__VAPID__PUBLIC_KEY'
        - container: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY
          description:
            en_US: 'Container Variable: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY'
        - container: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET
