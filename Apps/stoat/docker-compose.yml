    command: --config /etc/livekit/livekit.yml
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      livekit-config:
        condition: service_completed_successfully
    ports:
      - "7881:7881"
      - "21028-21128:21028-21128/udp"
    volumes:
      - /DATA/AppData/$AppID/livekit:/etc/livekit
    x-casaos:
      volumes:
        - container: /etc/livekit
          description:
            en_US: 'Container Path: /etc/livekit'
      ports:
        - container: "7881"
          description:
            en_US: 'Container Port: 7881'
        - container: 21028-21128
          description:
            en_US: 'Container Port: 21028-21128'
  createbuckets:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: stoatfiles
      MINIO_ROOT_PASSWORD: e347aa2e-1555-4b99-81a3-a09ccb6058ec
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && /usr/bin/mc ready minio; do
          echo 'Waiting minio...'
          sleep 1
        done
        /usr/bin/mc mb minio/revolt-uploads || /usr/bin/mc stat minio/revolt-uploads
    x-casaos:
      envs:
        - container: MINIO_ROOT_USER
          description:
            en_US: 'Container Variable: MINIO_ROOT_USER'
        - container: MINIO_ROOT_PASSWORD
          description:
            en_US: 'Container Variable: MINIO_ROOT_PASSWORD'
configs:
  caddyfile:
    content: |
      {$$HOSTNAME} {
      route /.well-known/stoat {
      header Access-Control-Allow-Origin *
      respond "{\"api\":\"{$$HOSTNAME}/api\"}"
      }

      route /api* {
      uri strip_prefix /api
      reverse_proxy http://api:14702 {
      header_down Location "^/" "/api/"
      }
      }

      route /ws {
      uri strip_prefix /ws
      reverse_proxy http://events:14703 {
      header_down Location "^/" "/ws/"
      }
      }

      route /autumn* {
      uri strip_prefix /autumn
      reverse_proxy http://autumn:14704 {
      header_down Location "^/" "/autumn/"
      }
      }

      route /january* {
      uri strip_prefix /january
      reverse_proxy http://january:14705 {
      header_down Location "^/" "/january/"
      }
      }

      route /gifbox* {
      uri strip_prefix /gifbox
      reverse_proxy http://gifbox:14706 {
      header_down Location "^/" "/gifbox/"
      }
      }

      route /livekit* {
      uri strip_prefix /livekit
      reverse_proxy http://livekit:7880 {
      header_down Location "^/" "/livekit/"
      }
      }

      route /ingress* {
      uri strip_prefix /ingress
      reverse_proxy http://voice-ingress:8500 {
      header_down Location "^/" "/ingress/"
      }
      }

      reverse_proxy http://web:5000
      }
  revolt_toml:
    content: |
      [api.livekit.nodes.worldwide]
      url = "http://livekit:7880"
      lat = 0.0
      lon = 0.0

      [features.limits.new_user]
      video_resolution = [1920, 1080]
      video_aspect_ratio = [0.3, 10]

      [features.limits.default]
      video_resolution = [1920, 1080]
      video_aspect_ratio = [0.3, 10]

      [files.s3]
      path_style_buckets = false
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.stoat
  # Main service for this application
  main: caddy
  # Detailed description for the application
  description:
    en_US: Stoat is a self-hosted chat server, formerly Revolt. This stack runs the API, web app, file server, proxy, and voice ingress behind Caddy.
  # Brief tagline for the application
  tagline:
    en_US: Self-hosted chat, formerly Revolt
  # Developer's information
  developer: stoatchat
  # Author of this particular configuration
  author: BigBearTechWorld
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/stoat.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: The hostname is the literal stoat.localhost. CasaOS and ZimaOS edit environment literals; they do not substitute Compose variables. Before the first start, replace stoat.localhost in HOSTNAME, the VITE variables, and every REVOLT__HOSTS__* value. Caddy reads HOSTNAME. Stoat reads those REVOLT__HOSTS__* values over Revolt.toml. Point DNS at this machine. Forward external port 80 to host 20001 and external port 443 to host 20002. The shipped RabbitMQ password, Silo password, file encryption key, VAPID key, and LiveKit key pair are public. Replace them before storing data or exposing voice, then keep the file encryption key stable. Set the same Silo user and password on minio and createbuckets. Set the same LiveKit key and secret on the API services and on livekit-config, which writes livekit.yml on start. Forward UDP 21028-21128 and TCP 7881 for voice. The web image publishes amd64 only.
  # Title for the application
  title:
    en_US: Stoat
  # Category under which the application falls
  category: Social
  # Default port mapping for the application
  port_map: "20002"
