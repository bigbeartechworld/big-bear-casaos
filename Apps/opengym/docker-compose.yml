name: big-bear-opengym
services:
  opengym:
    image: registry.gitlab.com/duartesantos8/opengym/web:1.3.9@sha256:eb97d4f78a9d495a41d0181440ae3394feab41e7200b7a4a36099cee36e80036
    container_name: opengym
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "20808:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
    volumes:
      - /DATA/AppData/$AppID/media/img:/usr/share/nginx/html/img:ro
      - /DATA/AppData/$AppID/media/gif:/usr/share/nginx/html/gif:ro
    x-casaos:
      envs:
        - container: NGINX_PORT
          description:
            en_US: 'Container Variable: NGINX_PORT'
        - container: BACKEND
          description:
            en_US: 'Container Variable: BACKEND'
        - container: PORT
          description:
            en_US: 'Container Variable: PORT'
        - container: RESOLVER
          description:
            en_US: 'Container Variable: RESOLVER'
        - container: CF_CONNECTING_IP
          description:
            en_US: 'Container Variable: CF_CONNECTING_IP'
        - container: BASE_PATH
          description:
            en_US: 'Container Variable: BASE_PATH'
        - container: MEDIA_UPLOAD_MAX
          description:
            en_US: 'Container Variable: MEDIA_UPLOAD_MAX'
      volumes:
        - container: /usr/share/nginx/html/img
          description:
            en_US: 'Container Path: /usr/share/nginx/html/img'
        - container: /usr/share/nginx/html/gif
          description:
            en_US: 'Container Path: /usr/share/nginx/html/gif'
      ports:
        - container: "80"
          description:
            en_US: 'Container Port: 80'
  api:
    image: registry.gitlab.com/duartesantos8/opengym/api:1.3.9@sha256:88b192dd743ed3746ddeeb973952bdf380c810d6b69337b8205d96d053d7962f
    container_name: opengym-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      RP_ID: localhost
      ORIGIN: http://localhost:20808
      RP_NAME: openGym
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID/coach-auth:/coach-auth
    x-casaos:
      envs:
        - container: PORT
          description:
            en_US: 'Container Variable: PORT'
        - container: DATA_DIR
          description:
            en_US: 'Container Variable: DATA_DIR'
        - container: TRUST_PROXY
          description:
            en_US: 'Container Variable: TRUST_PROXY'
        - container: RP_ID
          description:
            en_US: 'Container Variable: RP_ID'
        - container: ORIGIN
          description:
            en_US: 'Container Variable: ORIGIN'
        - container: RP_NAME
          description:
            en_US: 'Container Variable: RP_NAME'
      volumes:
        - container: /data
          description:
            en_US: 'Container Path: /data'
        - container: /coach-auth
          description:
            en_US: 'Container Path: /coach-auth'
  media:
    image: alpine/git:2.54.0@sha256:ce84fd6a057b4dc5cf5009da2dd832f1c6d096c1984bf50496cf3c256402264d
    container_name: opengym-media
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ] || [ -z "$$(ls -A /out/gif 2>/dev/null)" ]; then
          rm -rf /tmp/ds
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/
          cp /tmp/ds/videos/*.gif /out/gif/
        fi
    volumes:
      - /DATA/AppData/$AppID/media/img:/out/img
      - /DATA/AppData/$AppID/media/gif:/out/gif
    x-casaos:
      volumes:
        - container: /out/img
          description:
            en_US: 'Container Path: /out/img'
        - container: /out/gif
          description:
            en_US: 'Container Path: /out/gif'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.opengym
  # Main service for this application
  main: opengym
  # Detailed description for the application
  description:
    en_US: openGym is a self-hosted gym and body-weight tracker. It plans workouts, logs sets, and signs you in with passkeys. The web container proxies the API and serves exercise media.
  # Brief tagline for the application
  tagline:
    en_US: Self-hosted workout tracker
  # Developer's information
  developer: Duarte Santos
  # Author of this particular configuration
  author: BigBearTechWorld
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/DuarteSantos8/openGym@main/frontend/public/icon-512.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: Open http://localhost:20808 and create a profile with a passkey. Passkeys work on localhost over HTTP. Any other hostname needs HTTPS plus matching RP_ID and ORIGIN. The first start downloads about 140 MB of exercise media. Host port 8080 was already in use, so this listing publishes 20808.
  # Title for the application
  title:
    en_US: openGym
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "20808"
