name: big-bear-linuxserver-krita
services:
  app:
    image: linuxserver/krita:5.3.4@sha256:c4c5d196457b839981690a8e242621bddd668a6f845ceefb27c69e142ee18346
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "3000"
          description:
            en_US: 'Container Port: 3000'
        - container: "3001"
          description:
            en_US: 'Container Port: 3001'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.krita
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: Krita is a professional FREE and open source painting program. It is made by artists that want to see affordable art tools for everyone.
  # Brief tagline for the application
  tagline:
    en_US: A professional FREE and open source painting program. It is made by artists that want to see affordable art tools for everyone.
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/krita-logo.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/krita-logo.png
  # Title for the application
  title:
    en_US: Krita
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "3000"
