name: big-bear-linuxserver-webstation
services:
  app:
    image: linuxserver/webstation:0.14.2-romm@sha256:3a6ddb89de3dae9865e9f3484b3e1dc0462d8d531007b5d4e93e423a368b6a89
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: 'Container Variable: PUID'
        - container: PGID
          description:
            en_US: 'Container Variable: PGID'
        - container: TZ
          description:
            en_US: 'Container Variable: TZ'
      volumes:
        - container: /config
          description:
            en_US: 'Container Path: /config'
      ports:
        - container: "3000"
          description:
            en_US: 'Container Port: 3000'
        - container: "3001"
          description:
            en_US: 'Container Port: 3001'
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.webstation
  # Main service for this application
  main: app
  # Detailed description for the application
  description:
    en_US: Webstation is a web native emulation focused LXQt desktop based on Ubuntu.
  # Brief tagline for the application
  tagline:
    en_US: A web native emulation focused LXQt desktop based on Ubuntu.
  # Developer's information
  developer: LinuxServer.io
  # Author of this particular configuration
  author: WisdomSky
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/webstation-logo.png
  # Thumbnail image for the application (if any)
  thumbnail: https://cdn.jsdelivr.net/gh/linuxserver/docker-templates@master/linuxserver.io/img/webstation-logo.png
  # Title for the application
  title:
    en_US: Webstation
  # Category under which the application falls
  category: Home
  # Default port mapping for the application
  port_map: "3000"
