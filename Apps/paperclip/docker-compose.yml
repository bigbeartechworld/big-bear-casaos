name: big-bear-paperclip
services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest@sha256:66056e8c979bc2f8ef35083ebd333b7c83224fe3234bd92d251b0bbce1054317
    container_name: paperclip
    ports:
      - "3101:3100"
    environment:
      PORT: "3100"
      HOST: 0.0.0.0
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_PUBLIC_URL: http://localhost:3101
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      BETTER_AUTH_SECRET: change-this-run-openssl-rand-hex-32
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: change-this-run-openssl-rand-hex-32
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GITHUB_TOKEN: ""
    volumes:
      - /DATA/AppData/$AppID/data:/paperclip
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - paperclip_network
    x-casaos:
      envs:
        - container: PORT
          description:
            en_US: 'Container Variable: PORT'
        - container: HOST
          description:
            en_US: 'Container Variable: HOST'
        - container: SERVE_UI
          description:
            en_US: 'Container Variable: SERVE_UI'
        - container: PAPERCLIP_HOME
          description:
            en_US: 'Container Variable: PAPERCLIP_HOME'
        - container: PAPERCLIP_PUBLIC_URL
          description:
            en_US: 'Container Variable: PAPERCLIP_PUBLIC_URL'
        - container: PAPERCLIP_DEPLOYMENT_MODE
          description:
            en_US: 'Container Variable: PAPERCLIP_DEPLOYMENT_MODE'
        - container: PAPERCLIP_DEPLOYMENT_EXPOSURE
          description:
            en_US: 'Container Variable: PAPERCLIP_DEPLOYMENT_EXPOSURE'
        - container: BETTER_AUTH_SECRET
          description:
            en_US: 'Container Variable: BETTER_AUTH_SECRET'
        - container: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
          description:
            en_US: 'Container Variable: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET'
        - container: ANTHROPIC_API_KEY
          description:
            en_US: 'Container Variable: ANTHROPIC_API_KEY'
        - container: OPENAI_API_KEY
          description:
            en_US: 'Container Variable: OPENAI_API_KEY'
        - container: GEMINI_API_KEY
          description:
            en_US: 'Container Variable: GEMINI_API_KEY'
        - container: GITHUB_TOKEN
          description:
            en_US: 'Container Variable: GITHUB_TOKEN'
      volumes:
        - container: /paperclip
          description:
            en_US: 'Container Path: /paperclip'
      ports:
        - container: "3100"
          description:
            en_US: 'Container Port: 3100'
networks:
  paperclip_network:
    driver: bridge
x-casaos:
  # Supported CPU architectures for this application
  architectures:
    - amd64
    - arm64
  # Stable reverse-domain app identifier
  id: com.bigbeartechworld.paperclip
  # Main service for this application
  main: paperclip
  # Detailed description for the application
  description:
    en_US: Paperclip is an open-source self-hosted board for managing AI coding agents such as Claude Code, Codex, OpenCode, and Gemini CLI. Assign work to agents, run them, and track cost and output from a single dashboard.
  # Brief tagline for the application
  tagline:
    en_US: Self-hosted board for managing AI coding agents
  # Developer's information
  developer: paperclipai
  # Author of this particular configuration
  author: BigBearTechWorld
  # Icon URL for the application
  icon: https://cdn.jsdelivr.net/gh/paperclipai/paperclip@master/ui/public/apple-touch-icon.png
  # Thumbnail image for the application (if any)
  thumbnail: ""
  # Installation tips
  tips:
    before_install:
      en_US: 'This app ships with placeholder secrets so it starts without configuration. They are the same for every install and are not secret. Replace BETTER_AUTH_SECRET and PAPERCLIP_TOOL_ACTION_SIGNING_SECRET with ''openssl rand -hex 32'' before using it for anything real. Also change PAPERCLIP_PUBLIC_URL from localhost to the exact address and port you browse to, for example http://192.168.1.50:3101: the port is 3101 on most platforms but 10201 on Umbrel, and sign-in callbacks fail while it is wrong. See the app README.'
  # Title for the application
  title:
    en_US: Paperclip
  # Category under which the application falls
  category: AI
  # Default port mapping for the application
  port_map: "3101"
